<!DOCTYPE html>
<html lang="fr">
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../../assets/icons/STI_by_AE.ico" />
    <meta name="robots" content="noai, noimageai" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.tailwindcss.com; img-src 'self' data: blob: https://images.unsplash.com; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https://www.w3schools.com https://interactive-examples.mdn.mozilla.net; frame-src 'self' https://www.youtube.com https://example.com https://exemple.tn; connect-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta charset="UTF-8" />
    <title>Carte bancaire animée</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card-wrapper">
        <div class="card" id="card">
          <div class="card-face card-front">
            <div class="glow"></div>
            <div class="chip"><div class="chip-inner"></div></div>
            <div class="card-number" id="cardNumber">#### #### #### ####</div>
            <div class="card-bottom">
              <div>
                <div class="label">Titulaire</div>
                <div class="value" id="cardName">NOM PRÉNOM</div>
              </div>
              <div>
                <div class="label">Expire</div>
                <div class="value" id="cardExpiry">MM/AA</div>
              </div>
              <div class="brand">VISA</div>
            </div>
          </div>

          <div class="card-face card-back">
            <div class="magnetic-strip"></div>
            <div class="cvv-section">
              <div class="cvv-label">CVV</div>
              <div class="cvv-box" id="cardCvv">•••</div>
            </div>
            <div class="brand-back">VISA</div>
          </div>
        </div>
      </div>

      <form class="form" onsubmit="event.preventDefault();">
        <h2>Détails de paiement</h2>

        <div class="field">
          <label>Numéro de carte</label>
          <input
            type="text"
            id="number"
            maxlength="19"
            placeholder="1234 5678 9012 3456"
            inputmode="numeric"
            oninput="majNumero(this)"
          />
        </div>

        <div class="field">
          <label>Nom du titulaire</label>
          <input
            type="text"
            id="name"
            placeholder="Ali Ben Salah"
            oninput="majNom(this)"
            onblur="finaliserNom(this)"
          />
          <span class="compteur" id="nomCompteur">0 / 20</span>
        </div>

        <div class="row">
          <div class="field">
            <label>Expiration (MM/AA)</label>
            <input
              type="text"
              id="expiry"
              maxlength="5"
              placeholder="MM/AA"
              inputmode="numeric"
              oninput="majExpiry(this)"
            />
            <span class="erreur-msg" id="expiryErreur"></span>
          </div>
          <div class="field">
            <label>CVV</label>
            <input
              type="text"
              id="cvv"
              maxlength="3"
              placeholder="123"
              inputmode="numeric"
              onfocus="retournerCarte()"
              onblur="remettreCarte()"
              oninput="majCvv(this)"
            />
            <span class="erreur-msg" id="cvvErreur"></span>
          </div>
        </div>

        <button class="submit-btn">Payer maintenant</button>
      </form>
    </div>

    <script src="controle.js"></script>
  <!-- 🔒 Protection du contenu STI -->
<link rel="stylesheet" href="../../assets/css/protection.css" />
<script src="../../assets/js/protection.js" defer></script>
<!-- /Protection -->
</body>
</html>
