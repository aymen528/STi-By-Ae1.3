    <title>Animation HTML &amp; CSS — 4ème SI</title>

    <style>
      :root {
        --bg: #20233c;
        --panel: #2a2e4d;
        --line: #414876;
        --text: #f2efe4;
        --muted: #a8adcf;
        --js: #ffe066;
        --ink: #2b2410;
        --tag: #ff9c9c;
        --attr: #ffe066;
        --val: #8de0b0;
        --sel: #8db8ff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Manrope", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
      }
      .bar h1 {
        margin: 0;
        font-size: 1rem;
        font-weight: 800;
        flex: 1 1 auto;
        white-space: nowrap;
      }
      button {
        font: inherit;
        font-weight: 700;
        font-size: 0.85rem;
        cursor: pointer;
        padding: 7px 14px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }
      button:hover {
        transform: translateY(-1px);
      }
      #play {
        background: var(--js);
        color: var(--ink);
        border-color: var(--js);
        min-width: 110px;
      }
      .speed {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .speed input {
        width: 90px;
        accent-color: var(--js);
      }
      .prog {
        flex: 1 1 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
      }
      .prog .lbl {
        color: var(--js);
        font-weight: 700;
        white-space: nowrap;
      }
      .track {
        flex: 1;
        height: 6px;
        border-radius: 6px;
        background: var(--panel);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0;
        background: var(--js);
        transition: width 0.15s;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 8px;
        padding: 8px;
      }
      .pane {
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .pane > header {
        padding: 8px 12px;
        font-size: 0.82rem;
        font-weight: 700;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pane.active .dot {
        background: var(--js);
        box-shadow: 0 0 8px var(--js);
      }
      pre {
        flex: 1;
        margin: 0;
        padding: 12px 14px;
        overflow: auto;
        font: 400 0.9rem/1.6 "JetBrains Mono", ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .t {
        color: var(--tag);
      }
      .a {
        color: var(--attr);
      }
      .v {
        color: var(--val);
      }
      .s {
        color: var(--sel);
      }
      .p {
        color: var(--attr);
      }
      .m {
        color: var(--muted);
      }
      .cur {
        display: inline-block;
        width: 8px;
        height: 1.05em;
        vertical-align: text-bottom;
        background: var(--js);
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      iframe {
        flex: 1;
        width: 100%;
        border: 0;
        background: #fff;
      }
      @media (max-width: 900px) {
        body {
          height: auto;
        }
        main {
          flex-direction: column;
        }
        .pane {
          flex: none;
          height: 38vh;
        }
        iframe {
          min-height: 38vh;
        }
      }
    </style>

    <main>

        <header>
          <span class="dot" style="background: var(--val)"></span>Aperçu
          instantané
        </header>
        <iframe
          id="view"
          title="Aperçu"
          srcdoc='<!DOCTYPE html><meta charset="utf-8"><style id="s"></style><body>'
        ></iframe>
      </section>
    </main>

      ];

      var TASKS = [];
      STEPS.forEach(function (s, i) {
        TASKS.push({ pane: "html", text: s.html, step: i });
        TASKS.push({ pane: "css", text: s.css, step: i });
      });
      var TOTAL = TASKS.reduce(function (n, t) {
        return n + t.text.length;
      }, 0);

      var $ = function (id) {
        return document.getElementById(id);
      };
      var els = { html: $("c-html"), css: $("c-css") },
        panes = { html: $("p-html"), css: $("p-css") };
      var buf,
        ti,
        ci,
        typed,
        playing,
        timer,
        skip,
        speed = 1,
        active = "html";

      function esc(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function hlHtml(src) {
        return esc(src).replace(
          /(&lt;\/?)([\w-]+)|(\s)([\w-]+)(=)("[^"]*"?)|(&gt;)/g,
          function (m, a, b, c, d, e, f, g) {
            if (b) return a + '<span class="t">' + b + "</span>";
            if (d)
              return (
                c +
                '<span class="a">' +
                d +
                "</span>" +
                e +
                '<span class="v">' +
                f +
                "</span>"
              );
            return m;
          }
        );
      }
      function hlCss(src) {
        return esc(src).replace(
          /([^{};]+?)(\{)|([\w-]+)(\s*:\s*)([^;{}]*)(;?)/g,
          function (m, sel, br, p, c, v, sc) {
            if (br) return '<span class="s">' + sel + "</span>" + br;
            return (
              '<span class="p">' +
              p +
              "</span>" +
              c +
              '<span class="v">' +
              v +
              "</span>" +
              sc
            );
          }
        );
      }
      function render() {
        ["html", "css"].forEach(function (k) {
          var h = (k === "html" ? hlHtml : hlCss)(buf[k]);
          els[k].innerHTML =
            h + (k === active ? '<span class="cur"></span>' : "");
          panes[k].classList.toggle("active", k === active && playing);
          els[k].scrollTop = els[k].scrollHeight;
        });
      }
      function preview() {
        try {
          var d = $("view").contentDocument;
          d.getElementById("s").textContent = buf.css;
          d.body.innerHTML = buf.html;
          d.defaultView.scrollTo(0, d.body.scrollHeight);
        } catch (e) {
          $("view").srcdoc =
            "<!DOCTYPE html><meta charset='utf-8'><style>" +
            buf.css +
            "</style><body>" +
            buf.html;
        }
      }
      function progress() {
        var t = TASKS[Math.min(ti, TASKS.length - 1)];
        $("lbl").textContent =
          "Étape " +
          (t.step + 1) +
          "/" +
          STEPS.length +
          " — " +
          STEPS[t.step].t;
        $("fill").style.width = (100 * typed) / TOTAL + "%";
      }
      function tick() {
        if (!playing) return;
        var task = TASKS[ti];
        if (!task) {
          finish();
          return;
        }
        var txt = task.text,
          end = ci + 1;
        if (skip) end = txt.length;
        else
          while (
            txt[end] === " " &&
            (txt[end - 1] === "\n" || txt[end - 1] === " ")
          )
            end++;
        active = task.pane;
        buf[task.pane] += txt.slice(ci, end);
        typed += end - ci;
        ci = end;
        var last = txt[ci - 1],
          done = ci >= txt.length,
          delay;
        render();
        progress();
        if ("\n>;}".indexOf(last) >= 0 || ci % 6 === 0 || done) preview();
        if (done) {
          ti++;
          ci = 0;
          delay = 450;
          if (skip && (!TASKS[ti] || TASKS[ti].step !== task.step))
            skip = false;
          if (!TASKS[ti]) {
            finish();
            return;
          }
        } else delay = last === "\n" ? 140 : 20 + Math.random() * 25;
        timer = setTimeout(tick, skip ? 0 : delay / speed);
      }
      function finish() {
        playing = false;
        $("play").textContent = "↺ Rejouer";
        render();
        $("lbl").textContent = "Terminé ✔ — page complète";
      }
      function reset() {
        clearTimeout(timer);
        buf = { html: "", css: "" };
        ti = 0;
        ci = 0;
        typed = 0;
        playing = false;
        skip = false;
        active = "html";
        $("play").textContent = "▶ Lecture";
        render();
        preview();
        progress();
      }
      function play() {
        if (ti >= TASKS.length) reset();
        playing = true;
        $("play").textContent = "⏸ Pause";
        clearTimeout(timer);
        tick();
      }
      $("play").onclick = function () {
        if (playing) {
          playing = false;
          clearTimeout(timer);
          $("play").textContent = "▶ Lecture";
          render();
        } else play();
      };
      $("skip").onclick = function () {
        if (ti < TASKS.length) {
          skip = true;
          if (!playing) play();
          else {
            clearTimeout(timer);
            tick();
          }
        }
      };
      $("reset").onclick = function () {
        reset();
        play();
      };
      $("speed").oninput = function () {
        speed = +this.value;
        $("sv").textContent = "×" + speed;
      };

      function start() {
        reset();
        setTimeout(play, 500);
      }
      var f = $("view");
      function ready() {
        try {
          return (
            f.contentDocument &&
            f.contentDocument.readyState === "complete" &&
            f.contentDocument.getElementById("s")
          );
        } catch (e) {
          return false;
        }
      }
      if (ready()) start();
      else f.addEventListener("load", start, { once: true });
    </script>
