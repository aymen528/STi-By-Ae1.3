<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta name="robots" content="noai, noimageai" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projet STI 0 - Accueil</title>
    <style>
      :root {
        --bleu: #1e3a8a;
        --bleu2: #3b82f6;
        --fond: #f1f5f9;
        --texte: #0f172a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--fond);
        color: var(--texte);
        display: flex;
      }
      aside {
        width: 260px;
        flex-shrink: 0;
        background: linear-gradient(180deg, var(--bleu), var(--bleu2));
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 24px 16px;
      }
      aside h1 {
        font-size: 1.4rem;
        margin-bottom: 6px;
      }
      aside p {
        opacity: 0.85;
        font-size: 0.9rem;
        margin-bottom: 28px;
      }
      nav {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      nav a {
        text-decoration: none;
        color: #fff;
        padding: 12px 16px;
        border-radius: 10px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        font-weight: 600;
        transition: 0.2s;
      }
      nav a:hover,
      nav a.actif {
        background: #fff;
        color: var(--bleu);
        border-color: #fff;
      }
      aside small {
        margin-top: auto;
        opacity: 0.75;
        font-size: 0.75rem;
        line-height: 1.4;
      }
      main {
        flex: 1;
        padding: 20px;
        display: flex;
      }
      iframe {
        flex: 1;
        width: 100%;
        border: none;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      }
      @media (max-width: 700px) {
        body {
          flex-direction: column;
        }
        aside {
          width: 100%;
          padding: 16px;
        }
        aside p {
          margin-bottom: 12px;
        }
        nav {
          flex-direction: row;
          flex-wrap: wrap;
        }
        aside small {
          display: none;
        }
        main {
          min-height: 70vh;
        }
      }
    </style>
  <link rel="stylesheet" href="../../assets/css/protection.css" />
  <script src="../../assets/js/protection.js?v=98" defer></script>
  </head>
  <body>
    <aside>
      <h1>Bureau de statistiques</h1>
      <p>Sondages mensuels - Projet STI 0</p>
      <nav>
        <a href="Sondage.html" target="contenu" class="actif"
          >Participer au sondage</a
        >
        <a href="Statistiques.html" target="contenu"
          >Consulter les statistiques</a
        >
      </nav>
      <small
        >4ème Sciences de l'informatique 2<br />Systèmes et Technologies de
        l'Informatique</small
      >
    </aside>

    <main>
      <iframe name="contenu" src="Sondage.html" title="Contenu"></iframe>
    </main>
    <script src="../../assets/js/supabase-umd.js"></script>
    <script src="../../assets/js/config.js?v=98"></script>
    <script src="../../assets/js/acces.js?v=98"></script>
  </body>
</html>
