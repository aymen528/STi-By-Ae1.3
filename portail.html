<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, noai, noimageai" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://vywujxmepvcbgedgmger.supabase.co https://ipapi.co; base-uri 'self'" />
<link rel="icon" href="https://aymenessouyah.github.io/STiV2.0/assets/icons/STI_by_AE.ico" />
<title>Accès — Plateforme STI V2.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 22px; color: #f2ead8; font-family: system-ui, "Segoe UI", sans-serif;
    background:
      radial-gradient(900px 480px at 8% -10%, rgba(212,169,78,.14), transparent 65%),
      radial-gradient(800px 460px at 100% 0%, rgba(79,109,245,.16), transparent 65%),
      radial-gradient(700px 500px at 50% 115%, rgba(212,169,78,.10), transparent 70%),
      linear-gradient(160deg, #0b1020, #101b36 55%, #0b1020);
    overflow-x: hidden;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(212,169,78,.12) 1px, transparent 1.4px);
    background-size: 26px 26px;
    mask-image: radial-gradient(70% 60% at 50% 40%, #000 0%, transparent 100%);
  }
  .carte {
    width: 100%; max-width: 450px; position: relative;
    background: linear-gradient(165deg, rgba(255,255,255,.09), rgba(255,255,255,.03) 40%, rgba(212,169,78,.06));
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
    border: 1px solid rgba(212,169,78,.35); border-radius: 28px;
    padding: 34px 28px 22px;
    box-shadow: 0 40px 90px -40px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.12);
    animation: entree .6s cubic-bezier(.22,1,.36,1);
  }
  @keyframes entree { from { opacity: 0; transform: translateY(22px) scale(.98); } }
  .carte::before {
    content: ""; position: absolute; top: -1px; left: 12%; right: 12%; height: 2px;
    background: linear-gradient(90deg, transparent, #f0cf7e, transparent);
  }
  .entete { text-align: center; margin-bottom: 22px; }
  .halo {
    display: inline-block; padding: 9px; border-radius: 28px;
    background: radial-gradient(circle at 35% 30%, rgba(240,207,126,.28), rgba(212,169,78,.08) 70%);
    border: 1px solid rgba(212,169,78,.4);
    box-shadow: 0 14px 34px -14px rgba(212,169,78,.5);
  }
  .entete img { width: 76px; height: 76px; border-radius: 22px; display: block; }
  .entete h1 {
    margin-top: 14px; font-size: 27px; font-weight: 800; letter-spacing: 2px;
    font-family: Georgia, "Times New Roman", serif; color: #f0cf7e;
  }
  .entete h1 span {
    display: inline-block; font-family: system-ui, sans-serif; font-size: 10.5px; font-weight: 800;
    color: #14100e; background: linear-gradient(120deg,#f0cf7e,#d4a94e); border-radius: 999px;
    padding: 4px 10px; margin-left: 8px; vertical-align: 6px; letter-spacing: 1px;
  }
  .entete p { color: #98a0b8; font-size: 13px; margin-top: 7px; }
  .onglets {
    display: flex; gap: 4px; margin-bottom: 8px; padding: 5px; border-radius: 16px;
    background: rgba(8,12,26,.6); border: 1px solid rgba(212,169,78,.2);
  }
  .onglets button {
    flex: 1; border: 0; background: transparent; color: #98a0b8; font-weight: 700;
    font-size: 12.5px; padding: 11px 2px; border-radius: 12px; cursor: pointer; transition: all .25s;
  }
  .onglets button.actif {
    background: linear-gradient(120deg,#d4a94e,#f0cf7e); color: #1a1406;
    box-shadow: 0 8px 20px -8px rgba(212,169,78,.6);
  }
  label {
    display: block; margin: 13px 0 5px; font-size: 10.5px; font-weight: 800;
    letter-spacing: 1.2px; text-transform: uppercase; color: #c9b37e;
  }
  input[type=email], input[type=password], input[type=text], select {
    width: 100%; padding: 13px 14px; border-radius: 13px; outline: none;
    border: 1px solid rgba(212,169,78,.25); background: rgba(8,12,26,.55);
    color: #f2ead8; font-size: 14.5px; transition: border .25s, box-shadow .25s, background .25s;
  }
  input:focus, select:focus {
    border-color: #f0cf7e; background: rgba(8,12,26,.8);
    box-shadow: 0 0 0 4px rgba(212,169,78,.15);
  }
  select option { color: #23201a; background: #fffdf7; }
  .ligne-captcha { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
  canvas {
    border-radius: 13px; border: 1px solid rgba(212,169,78,.35);
    background: rgba(8,12,26,.7); box-shadow: inset 0 2px 8px rgba(0,0,0,.4);
  }
  .rafraichir {
    width: 46px; height: 46px; border-radius: 13px; cursor: pointer; font-size: 18px;
    border: 1px solid rgba(212,169,78,.35); background: rgba(8,12,26,.55); color: #f0cf7e;
    transition: transform .3s;
  }
  .rafraichir:hover { transform: rotate(180deg); }
  .btn {
    width: 100%; margin-top: 20px; padding: 14px; border: 0; border-radius: 14px;
    background: linear-gradient(120deg,#d4a94e,#f0cf7e); color: #1a1406;
    font-weight: 900; font-size: 15px; letter-spacing: .4px; cursor: pointer;
    box-shadow: 0 14px 30px -12px rgba(212,169,78,.65), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .15s, box-shadow .15s, filter .2s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(2px); box-shadow: 0 6px 16px -8px rgba(212,169,78,.6); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .qr-zone {
    display: flex; align-items: center; gap: 14px; margin-top: 18px; padding: 12px 14px;
    background: rgba(8,12,26,.45); border: 1px dashed rgba(212,169,78,.4); border-radius: 16px;
  }
  .qr-zone img {
    width: 92px; height: 92px; border-radius: 12px; background: #fffdf7;
    border: 1px solid rgba(212,169,78,.5); box-shadow: 0 10px 24px -10px rgba(0,0,0,.7);
  }
  .qr-zone b { color: #f0cf7e; font-size: 14px; }
  .qr-zone span { color: #98a0b8; font-size: 12px; }
  .msg { margin-top: 14px; font-size: 13px; font-weight: 700; text-align: center; min-height: 18px; }
  .msg.ok { color: #7ddba3; } .msg.err { color: #ff8f8f; } .msg.att { color: #f0cf7e; }
  .lien-admin { margin-top: 14px; text-align: center; }
  .lien-admin a { color: #98a0b8; font-size: 12px; text-decoration: none; border-bottom: 1px dotted rgba(212,169,78,.5); }
  .pied {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(212,169,78,.15);
    text-align: center; font-size: 11.5px; color: #6d7690;
  }
  form[hidden] { display: none; }
</style>
</head>
<body>
  <main class="carte">
    <div class="entete">
      <span class="halo"><img src="assets/icons/sti-icon-512.png" alt="Logo STI" /></span>
      <h1>STI <span>V2.0</span></h1>
      <p>Espace réservé aux abonnés — connectez-vous pour continuer.</p>
    </div>

    <div class="onglets" role="tablist">
      <button id="tab-connexion" class="actif" type="button">🔐 Connexion</button>
      <button id="tab-inscription" type="button">📝 Inscription</button>
      <button id="tab-oubli" type="button">🔑 Oublié</button>
    </div>

    <form id="f-connexion" autocomplete="on">
      <label for="c-email">Adresse e-mail</label>
      <input id="c-email" type="email" required placeholder="vous@exemple.tn" />
      <label for="c-mdp">Mot de passe</label>
      <input id="c-mdp" type="password" required placeholder="••••••••" />
      <label>Captcha — recopiez le code</label>
      <div class="ligne-captcha">
        <canvas id="captcha-canvas" width="150" height="46" aria-label="Code de vérification"></canvas>
        <button id="captcha-refresh" class="rafraichir" type="button" title="Nouveau code">↻</button>
      </div>
      <input id="c-captcha" type="text" required placeholder="Code ci-dessus" autocomplete="off" />
      <button class="btn" type="submit">🔐 Se connecter</button>
      <div class="qr-zone">
        <img src="assets/images/qr-v2.png" alt="QR code du site STI V2.0" />
        <div><b>📱 Scannez-moi !</b><br /><span>Ouvrez la plateforme sur votre téléphone ou partagez l'accès.</span></div>
      </div>
    </form>

    <form id="f-inscription" hidden autocomplete="on">
      <label for="i-email">Adresse e-mail</label>
      <input id="i-email" type="email" required placeholder="vous@exemple.tn" />
      <label for="i-lycee">Lycée</label>
      <select id="i-lycee">
        <option value="Lycée Rafèha" selected>Lycée Rafèha</option>
        <option value="__autre">Autre lycée…</option>
      </select>
      <input id="i-lycee-autre" type="text" hidden placeholder="Nom de votre lycée" />
      <label for="i-classe">Classe</label>
      <select id="i-classe">
        <option value="3eme SI1" selected>3ème SI 1</option>
        <option value="3eme SI2">3ème SI 2</option>
        <option value="4eme SI1">4ème SI 1</option>
        <option value="4eme SI2">4ème SI 2</option>
        <option value="__autre">Autre…</option>
      </select>
      <input id="i-classe-autre" type="text" hidden placeholder="Votre classe" />
      <label for="i-mdp">Mot de passe (6 caractères min.)</label>
      <input id="i-mdp" type="password" required minlength="6" placeholder="••••••••" />
      <label for="i-mdp2">Confirmez le mot de passe</label>
      <input id="i-mdp2" type="password" required minlength="6" placeholder="••••••••" />
      <label>Captcha — recopiez le code</label>
      <div class="ligne-captcha">
        <canvas id="captcha-canvas2" width="150" height="46" aria-label="Code de vérification"></canvas>
        <button id="captcha-refresh2" class="rafraichir" type="button" title="Nouveau code">↻</button>
      </div>
      <input id="i-captcha" type="text" required placeholder="Code ci-dessus" autocomplete="off" />
      <button class="btn" type="submit">📝 S'inscrire</button>
    </form>

    <form id="f-oubli" hidden>
      <label for="o-email">Adresse e-mail du compte</label>
      <input id="o-email" type="email" required placeholder="vous@exemple.tn" />
      <button class="btn" type="submit"> Recevoir le lien de réinitialisation</button>
    </form>

    <div class="msg" id="msg" role="status"></div>
    <div class="lien-admin"><a href="admin.html">⚙️ Tableau de bord administrateur</a></div>
    <div class="pied">Plateforme STI © A. Essouyah — Lycée Raféha · 🔒 Contenu protégé, IA interdite</div>
  </main>

<script src="assets/js/supabase-umd.js"></script>
<script src="assets/js/config.js"></script>
<script>
  if (!window.supabase) {
    document.getElementById("msg").className = "msg err";
    document.getElementById("msg").textContent = "❌ Le script Supabase n'a pas pu être chargé — rechargez la page.";
  }
</script>
<script src="assets/js/portail.js"></script>
</body>
</html>
