<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, noai, noimageai" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://*.supabase.co https://ipapi.co; base-uri 'self'" />
<link rel="icon" href="https://aymenessouyah.github.io/STiV2.0/assets/icons/STI_by_AE.ico" />
<title>Accès — Plateforme STI V2.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #eef0f9; font-family: system-ui, "Segoe UI", sans-serif;
    background:
      radial-gradient(720px 340px at 12% -6%, rgba(244,81,30,.16), transparent 70%),
      radial-gradient(640px 320px at 96% 0%, rgba(139,147,255,.12), transparent 70%),
      #0b0d16;
  }
  .carte {
    width: 100%; max-width: 420px; background: #141827; border: 1px solid #242a41;
    border-radius: 20px; padding: 30px 26px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.7);
  }
  .entete { text-align: center; margin-bottom: 22px; }
  .entete img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 10px; }
  .entete h1 { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  .entete h1 span {
    display: inline-block; font-size: 11px; font-weight: 800; color: #14100e;
    background: linear-gradient(120deg,#ff8a50,#ffb27a); border-radius: 999px;
    padding: 3px 8px; margin-left: 6px; vertical-align: 4px;
  }
  .entete p { color: #9aa2ba; font-size: 13px; margin-top: 6px; }
  .onglets { display: flex; gap: 6px; margin-bottom: 18px; background: #0e1220; padding: 5px; border-radius: 12px; }
  .onglets button {
    flex: 1; border: 0; background: transparent; color: #9aa2ba; font-weight: 700;
    font-size: 13px; padding: 10px 4px; border-radius: 9px; cursor: pointer;
  }
  .onglets button.actif { background: linear-gradient(120deg,#f4511e,#ff8a50); color: #fff; }
  label { display: block; font-size: 12.5px; font-weight: 700; color: #9aa2ba; margin: 12px 0 5px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #323a58;
    background: #0e1220; color: #eef0f9; font-size: 14px; outline: none;
  }
  input:focus { border-color: #ff8a50; }
  .ligne-captcha { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
  #captcha-canvas { border-radius: 10px; border: 1px solid #323a58; background: #0e1220; }
  #captcha-refresh {
    border: 1px solid #323a58; background: #0e1220; color: #ff8a50; border-radius: 10px;
    width: 44px; height: 44px; font-size: 18px; cursor: pointer;
  }
  .btn {
    width: 100%; margin-top: 18px; border: 0; border-radius: 12px; padding: 13px;
    background: linear-gradient(120deg,#f4511e,#ff8a50); color: #fff; font-weight: 800;
    font-size: 15px; cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 14px; font-size: 13px; font-weight: 600; text-align: center; min-height: 18px; }
  .msg.ok { color: #6ee7b7; } .msg.err { color: #ff7a7a; } .msg.att { color: #f2b532; }
  .lien-admin { margin-top: 16px; text-align: center; }
  .lien-admin a { color: #9aa2ba; font-size: 12px; text-decoration: none; }
  .pied { margin-top: 18px; text-align: center; font-size: 11.5px; color: #5f6880; }
  form[hidden] { display: none; }
</style>
</head>
<body>
  <main class="carte">
    <div class="entete">
      <img src="assets/icons/sti-icon-192.png" alt="Logo STI" />
      <h1>STI <span>V2.0</span></h1>
      <p>Espace réservé aux abonnés — connectez-vous pour continuer.</p>
    </div>

    <div class="onglets" role="tablist">
      <button id="tab-connexion" class="actif" type="button">Connexion</button>
      <button id="tab-inscription" type="button">Inscription</button>
      <button id="tab-oubli" type="button">Mot de passe oublié</button>
    </div>

    <form id="f-connexion" autocomplete="on">
      <label for="c-email">Adresse e-mail</label>
      <input id="c-email" type="email" required placeholder="vous@exemple.tn" />
      <label for="c-mdp">Mot de passe</label>
      <input id="c-mdp" type="password" required placeholder="••••••••" />
      <label>Captcha — recopiez le code</label>
      <div class="ligne-captcha">
        <canvas id="captcha-canvas" width="150" height="44" aria-label="Code de vérification"></canvas>
        <button id="captcha-refresh" type="button" title="Nouveau code">↻</button>
      </div>
      <input id="c-captcha" type="text" required placeholder="Code ci-dessus" autocomplete="off" />
      <button class="btn" type="submit">🔐 Se connecter</button>
    </form>

    <form id="f-inscription" hidden autocomplete="on">
      <label for="i-email">Adresse e-mail</label>
      <input id="i-email" type="email" required placeholder="vous@exemple.tn" />
      <label for="i-mdp">Mot de passe (6 caractères min.)</label>
      <input id="i-mdp" type="password" required minlength="6" placeholder="••••••••" />
      <label for="i-mdp2">Confirmez le mot de passe</label>
      <input id="i-mdp2" type="password" required minlength="6" placeholder="••••••••" />
      <label>Captcha — recopiez le code</label>
      <div class="ligne-captcha">
        <canvas id="captcha-canvas2" width="150" height="44" aria-label="Code de vérification"></canvas>
        <button id="captcha-refresh2" type="button" title="Nouveau code">↻</button>
      </div>
      <input id="i-captcha" type="text" required placeholder="Code ci-dessus" autocomplete="off" />
      <button class="btn" type="submit">📝 S'inscrire</button>
    </form>

    <form id="f-oubli" hidden>
      <label for="o-email">Adresse e-mail du compte</label>
      <input id="o-email" type="email" required placeholder="vous@exemple.tn" />
      <button class="btn" type="submit"> Recevoir le lien de réinitialisation</button>
    </form>

    <div class="msg" id="msg" role="status"></div>
    <div class="lien-admin"><a href="admin.html">⚙️ Tableau de bord administrateur</a></div>
    <div class="pied">Plateforme STI © A. Essouyah — Lycée Raféha · 🔒 Contenu protégé, IA interdite</div>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/portail.js"></script>
</body>
</html>
