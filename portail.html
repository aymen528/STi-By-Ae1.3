<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, noai, noimageai" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://vywujxmepvcbgedgmger.supabase.co https://ipapi.co; base-uri 'self'" />
<link rel="icon" href="https://aymenessouyah.github.io/STiV2.0/assets/icons/STI_by_AE.ico" />
<title>Accès — Plateforme STI V2.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 22px; color: #23201a; font-family: system-ui, "Segoe UI", sans-serif;
    background:
      radial-gradient(760px 380px at 10% -8%, rgba(244,81,30,.16), transparent 70%),
      radial-gradient(640px 320px at 96% 0%, rgba(180,125,9,.12), transparent 70%),
      repeating-linear-gradient(45deg, transparent 0 26px, rgba(244,81,30,.03) 26px 27px),
      #f9f1e3;
  }
  .carte {
    width: 100%; max-width: 440px; background: #fffdf7;
    border: 2px solid #23201a; border-radius: 24px; padding: 32px 28px 24px;
    box-shadow: 8px 8px 0 #f4511e, 0 30px 70px -30px rgba(90,60,20,.4), inset 0 2px 0 rgba(255,255,255,.7);
    animation: entree .5s ease;
    position: relative; overflow: hidden;
  }
  @keyframes entree { from { opacity: 0; transform: translateY(16px); } }
  .carte::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #f4511e, #ff8a50, #f2b532, #f4511e);
  }
  .entete { text-align: center; margin-bottom: 20px; }
  .halo { display: inline-block; padding: 8px; border-radius: 26px; background: linear-gradient(135deg, rgba(244,81,30,.15), rgba(242,181,50,.18)); }
  .entete img { width: 78px; height: 78px; border-radius: 20px; display: block; box-shadow: 0 10px 24px -10px rgba(244,81,30,.55); }
  .entete h1 { margin-top: 12px; font-size: 26px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 0 rgba(244,81,30,.15); }
  .entete h1 span {
    display: inline-block; font-size: 11px; font-weight: 800; color: #fff;
    background: linear-gradient(120deg,#f4511e,#ff8a50); border-radius: 999px;
    padding: 4px 10px; margin-left: 6px; vertical-align: 6px; box-shadow: 0 4px 10px -4px rgba(244,81,30,.6);
  }
  .entete p { color: #7a6f5d; font-size: 13px; margin-top: 6px; }
  .onglets { display: flex; gap: 4px; margin-bottom: 6px; background: #f3ead9; padding: 5px; border-radius: 14px; border: 1px solid #eadfce; }
  .onglets button {
    flex: 1; border: 0; background: transparent; color: #7a6f5d; font-weight: 800;
    font-size: 12.5px; padding: 11px 2px; border-radius: 10px; cursor: pointer; transition: all .2s;
  }
  .onglets button.actif { background: linear-gradient(120deg,#f4511e,#ff8a50); color: #fff; box-shadow: 0 6px 14px -6px rgba(244,81,30,.6); }
  label { display: block; font-size: 12.5px; font-weight: 800; color: #7a6f5d; margin: 13px 0 5px; text-transform: uppercase; letter-spacing: .6px; font-size: 11px; }
  input[type=email], input[type=password], input[type=text], select {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 2px solid #e2d6c2;
    background: #fff; color: #23201a; font-size: 14.5px; outline: none; transition: border .2s, box-shadow .2s;
  }
  input:focus, select:focus { border-color: #f4511e; box-shadow: 0 0 0 4px rgba(244,81,30,.12); }
  .ligne-captcha { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
  canvas { border-radius: 12px; border: 2px solid #23201a; background: linear-gradient(160deg,#fff,#fdf6e8); box-shadow: 3px 3px 0 rgba(244,81,30,.4); }
  .rafraichir {
    border: 2px solid #23201a; background: #fff; color: #f4511e; border-radius: 12px;
    width: 46px; height: 46px; font-size: 19px; cursor: pointer; box-shadow: 3px 3px 0 rgba(244,81,30,.4);
  }
  .rafraichir:active, .btn:active { transform: translate(2px,2px); box-shadow: none; }
  .btn {
    width: 100%; margin-top: 20px; border: 2px solid #23201a; border-radius: 14px; padding: 14px;
    background: linear-gradient(120deg,#f4511e,#ff8a50); color: #fff; font-weight: 900;
    font-size: 15.5px; letter-spacing: .3px; cursor: pointer; box-shadow: 5px 5px 0 #23201a;
    transition: transform .12s, box-shadow .12s;
  }
  .btn:disabled { opacity: .5; cursor: wait; }
  .msg { margin-top: 14px; font-size: 13px; font-weight: 800; text-align: center; min-height: 18px; }
  .msg.ok { color: #177245; } .msg.err { color: #c0392b; } .msg.att { color: #b47d09; }
  .lien-admin { margin-top: 16px; text-align: center; }
  .lien-admin a { color: #7a6f5d; font-size: 12px; text-decoration: none; border-bottom: 1px dotted #b9a98d; }
  .pied { margin-top: 14px; padding-top: 12px; border-top: 1px dashed #e2d6c2; text-align: center; font-size: 11.5px; color: #a3937a; }
  .qr-zone {
    display: flex; align-items: center; gap: 14px; margin-top: 18px;
    background: #f9f1e3; border: 2px dashed #d9c8a9; border-radius: 16px; padding: 12px 14px;
  }
  .qr-zone img { width: 92px; height: 92px; border-radius: 12px; border: 2px solid #23201a; box-shadow: 3px 3px 0 rgba(244,81,30,.45); background: #fff; }
  .qr-zone b { color: #f4511e; font-size: 14px; }
  .qr-zone span { color: #7a6f5d; font-size: 12px; }
  form[hidden] { display: none; }
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  .wrap-carte { position: relative; width: 100%; max-width: 450px; }
  .wrap-carte::before {
    content: ""; position: absolute; inset: -3px; border-radius: 32px; z-index: 0;
    background: conic-gradient(from var(--ang), #f4511e, #f2b532, #ff8a50, #e4572e, #f4511e);
    animation: aurora 8s linear infinite; filter: blur(5px); opacity: .5;
  }
  @keyframes aurora { to { --ang: 360deg; } }
  .wrap-carte .carte { position: relative; z-index: 1; max-width: none; }
  .entete h1 {
    background: linear-gradient(120deg, #23201a 15%, #f4511e 55%, #b47d09 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .entete h1 span { -webkit-text-fill-color: #fff; }
  .halo img { animation: flotte 6s ease-in-out infinite alternate; }
  .champ { position: relative; display: block; }
  .champ .ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .8; pointer-events: none; }
  .champ input { padding-left: 41px; }
  .btn { position: relative; overflow: hidden; }
  .btn::after {
    content: ""; position: absolute; top: 0; left: -70%; width: 45%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.6), transparent);
    transform: skewX(-20deg); transition: left .65s ease;
  }
  .btn:hover::after { left: 135%; }
  .entete { animation: entree .55s .05s both; }
  .onglets { animation: entree .55s .15s both; }
  form { animation: entree .55s .25s both; }
  .pied, .lien-admin { animation: entree .55s .4s both; }
  ::selection { background: #f4511e; color: #fff; }
  .deco { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; }
  .deco1 { width: 360px; height: 360px; left: -130px; top: -90px; background: radial-gradient(circle, rgba(244,81,30,.15), transparent 70%); animation: flotte 9s ease-in-out infinite alternate; }
  .deco2 { width: 440px; height: 440px; right: -150px; bottom: -130px; background: radial-gradient(circle, rgba(242,181,50,.17), transparent 70%); animation: flotte 11s ease-in-out infinite alternate-reverse; }
  @keyframes flotte { from { transform: translateY(-16px); } to { transform: translateY(18px); } }
  .carte { z-index: 1; }
  .btn:hover:not(:disabled) { transform: translate(-1px,-2px); box-shadow: 7px 7px 0 #23201a; }
  .onglets button:hover:not(.actif) { color: #f4511e; transform: translateY(-1px); }
  input:hover, select:hover { border-color: #cbb894; }
  .qr-zone { transition: transform .25s, border-color .25s; }
  .qr-zone:hover { transform: translateY(-2px); border-color: #f4511e; }
</style>
</head>
<body>
  <div class="deco deco1"></div>
  <div class="deco deco2"></div>
  <div class="wrap-carte">
  <main class="carte">
    <div class="entete">
      <span class="halo"><img src="assets/icons/sti-icon-512.png" alt="Logo STI" /></span>
      <h1>STI <span>V2.0</span></h1>
      <p>Espace réservé aux abonnés — connectez-vous pour continuer.</p>
    </div>

    <div class="onglets" role="tablist">
      <button id="tab-connexion" class="actif" type="button">🔐 Connexion</button>
      <button id="tab-inscription" type="button">📝 Inscription</button>
      <button id="tab-oubli" type="button">🔑 Oublié</button>
    </div>

    <form id="f-connexion" autocomplete="on">
      <label for="c-email">Adresse e-mail</label>
      <span class="champ"><span class="ico">✉️</span><input id="c-email" type="email" required placeholder="vous@exemple.tn" /></span>
      <label for="c-mdp">Mot de passe</label>
      <span class="champ"><span class="ico">🔒</span><input id="c-mdp" type="password" required placeholder="••••••••" /></span>
      <label>Captcha — recopiez le code</label>
      <div class="ligne-captcha">
        <canvas id="captcha-canvas" width="150" height="46" aria-label="Code de vérification"></canvas>
        <button id="captcha-refresh" class="rafraichir" type="button" title="Nouveau code">↻</button>
      </div>
      <input id="c-captcha" type="text" required placeholder="Code ci-dessus" autocomplete="off" />
      <button class="btn" type="submit">🔐 Se connecter</button>
      <div class="qr-zone">
        <img src="assets/images/qr-stiv2.png?nc=2" alt="QR code du site STI" />
        <div><b>📱 Scannez-moi !</b><br /><span>Ouvrez la plateforme sur votre téléphone ou partagez l'accès.</span></div>
      </div>
    </form>

    <form id="f-inscription" hidden autocomplete="on">
      <label for="i-email">Adresse e-mail</label>
      <span class="champ"><span class="ico">✉️</span><input id="i-email" type="email" required placeholder="vous@exemple.tn" /></span>
      <label for="i-lycee">Lycée</label>
      <select id="i-lycee">
        <option value="Lycée Rafèha" selected>Lycée Rafèha</option>
        <option value="__autre">Autre lycée…</option>
      </select>
      <input id="i-lycee-autre" type="text" hidden placeholder="Nom de votre lycée" />
      <label for="i-classe">Classe</label>
      <select id="i-classe">
        <option value="3eme SI1" selected>3ème SI 1</option>
        <option value="3eme SI2">3ème SI 2</option>
        <option value="4eme SI1">4ème SI 1</option>
        <option value="4eme SI2">4ème SI 2</option>
        <option value="__autre">Autre…</option>
      </select>
      <input id="i-classe-autre" type="text" hidden placeholder="Votre classe" />
      <label for="i-mdp">Mot de passe (6 caractères min.)</label>
      <span class="champ"><span class="ico">🔒</span><input id="i-mdp" type="password" required minlength="6" placeholder="••••••••" /></span>
      <label for="i-mdp2">Confirmez le mot de passe</label>
      <span class="champ"><span class="ico">🔒</span><input id="i-mdp2" type="password" required minlength="6" placeholder="••••••••" /></span>
      <label>Captcha — recopiez le code</label>
      <div class="ligne-captcha">
        <canvas id="captcha-canvas2" width="150" height="46" aria-label="Code de vérification"></canvas>
        <button id="captcha-refresh2" class="rafraichir" type="button" title="Nouveau code">↻</button>
      </div>
      <input id="i-captcha" type="text" required placeholder="Code ci-dessus" autocomplete="off" />
      <button class="btn" type="submit">📝 S'inscrire</button>
    </form>

    <form id="f-oubli" hidden>
      <label for="o-email">Adresse e-mail du compte</label>
      <span class="champ"><span class="ico">✉️</span><input id="o-email" type="email" required placeholder="vous@exemple.tn" /></span>
      <button class="btn" type="submit"> Recevoir le lien de réinitialisation</button>
    </form>

    <div class="msg" id="msg" role="status"></div>
    <div class="lien-admin"><a href="admin.html">📊 Tableau de bord administrateur</a></div>
    <div class="pied">Plateforme STI © A. Essouyah — Lycée Raféha · 🔒 Contenu protégé, IA interdite</div>
  </main>
  </div>

<script src="assets/js/supabase-umd.js"></script>
<script src="assets/js/config.js"></script>
<script>
  if (!window.supabase) {
    document.getElementById("msg").className = "msg err";
    document.getElementById("msg").textContent = "❌ Le script Supabase n'a pas pu être chargé — rechargez la page.";
  }
</script>
<script src="assets/js/portail.js"></script>
</body>
</html>
