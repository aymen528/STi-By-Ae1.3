  }
  .liens a {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 12px 20px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    color: #eef0f9;
    border: 1px solid rgba(249, 241, 227, 0.25);
    background: rgba(42, 51, 82, 0.5);
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .liens a:hover { transform: translateY(-2px); background: rgba(62, 74, 116, 0.65); }
  .liens a.principal {
    background: linear-gradient(120deg, #f4511e, #ff8a50);
    border-color: transparent;
    color: #fff;
