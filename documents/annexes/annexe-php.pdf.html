    --bg:#f6eedc; --ink:#101728; --line:#e2d3b4; --edge:#101728;
    --accent:#f4511e; --surface:#fffdf5; --muted:#6b6250;
  }
  * { box-sizing:border-box; margin:0 }
  body {
    font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    color:var(--ink); background-color:var(--bg);
    background-image:
      radial-gradient(circle, rgba(16,23,40,.13) 1.15px, transparent 1.15px),
      linear-gradient(180deg, rgba(248,168,107,.28) 0%, rgba(248,168,107,0) 340px);
    background-repeat:repeat,no-repeat; background-size:23px 23px,100% 100%;
  }
  .barre {
    position:sticky; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:12px 18px; background:var(--surface);
    border-bottom:2.5px solid var(--edge);
  }
  .barre h1 { font-size:clamp(13px,2.6vw,16px); font-weight:800; letter-spacing:-.01em }
  .barre .nb { font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.08em }
  .outils { display:flex; gap:8px; flex:none }
  .btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:999px; border:2px solid var(--edge);
    font:800 12px/1 inherit; text-decoration:none; cursor:pointer;
    background:var(--surface); color:var(--ink); box-shadow:2.5px 2.5px 0 var(--edge);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform:translate(-1px,-1px); box-shadow:3.5px 3.5px 0 var(--edge) }
  .btn.plein { background:var(--ink); color:#f9f1e3; box-shadow:2.5px 2.5px 0 var(--accent) }
  .btn.plein:hover { box-shadow:3.5px 3.5px 0 var(--accent) }
  main { max-width:900px; margin:0 auto; padding:26px 16px 60px; display:grid; gap:22px }
  main img {
    width:100%; height:auto; display:block;
    background:#fff; border:2px solid var(--edge); border-radius:10px;
    box-shadow:6px 6px 0 rgba(16,23,40,.16);
  }
  @media (max-width:560px) { .barre { flex-wrap:wrap } main { padding:14px 10px 40px } }
  .retour { display:flex; justify-content:center; padding:4px 16px 54px }
  .retour .btn { font-size:13.5px; padding:12px 24px; box-shadow:3.5px 3.5px 0 var(--edge) }
  .retour .btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--edge) }
  @media print { .barre,.retour { display:none } main { max-width:none } img { box-shadow:none; border:none } body { background:#fff } }
