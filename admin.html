<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, noai, noimageai" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://vywujxmepvcbgedgmger.supabase.co https://ipapi.co; base-uri 'self'" />
<link rel="icon" href="https://aymenessouyah.github.io/STiV2.0/assets/icons/STI_by_AE.ico" />
<title>Tableau de bord — STI V2.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f9f1e3; color: #23201a; font-family: system-ui, "Segoe UI", sans-serif; padding: 24px; }
  .entete { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .entete img { width: 52px; height: 52px; border-radius: 14px; box-shadow: 0 8px 18px -8px rgba(244,81,30,.5); }
  h1 { font-size: 22px; font-weight: 900; }
  h1 span { font-size: 11px; background: linear-gradient(120deg,#f4511e,#ff8a50); color: #fff; border-radius: 999px; padding: 3px 9px; vertical-align: 5px; margin-left: 6px; }
  .sous { color: #7a6f5d; font-size: 13px; margin-bottom: 18px; }
  .barre { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .barre a, .barre button {
    border: 1.5px solid #e2d6c2; background: #fffdf7; color: #23201a; padding: 9px 16px;
    border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none;
  }
  .barre button:hover, .barre a:hover { border-color: #f4511e; color: #f4511e; }
  h2 { font-size: 16px; margin: 24px 0 10px; color: #f4511e; }
  .table-wrap { overflow-x: auto; border: 1.5px solid #eadfce; border-radius: 16px; background: #fffdf7; box-shadow: 3px 3px 0 rgba(244,81,30,.35); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  th { text-align: left; color: #7a6f5d; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; padding: 12px 14px; border-bottom: 1.5px solid #eadfce; }
  td { padding: 11px 14px; border-bottom: 1px solid #f3ead9; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .st { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
  .st.actif { background: rgba(23,114,69,.12); color: #177245; }
  .st.en_attente { background: rgba(180,125,9,.14); color: #b47d09; }
  .st.suspendu { background: rgba(122,111,93,.14); color: #7a6f5d; }
  .st.exclu { background: rgba(192,57,43,.12); color: #c0392b; }
  .act { border: 1.5px solid #e2d6c2; background: #fff; color: #23201a; border-radius: 8px; padding: 5px 9px; margin-right: 5px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .act:hover { border-color: #f4511e; color: #f4511e; }
  .msg { margin: 10px 0; font-size: 13px; font-weight: 700; min-height: 18px; }
  .msg.ok { color: #177245; } .msg.err { color: #c0392b; }
</style>
</head>
<body>
  <div class="entete">
    <img src="assets/icons/sti-icon-512.png" alt="Logo STI" />
    <h1>⚙️ Tableau de bord <span>ADMIN</span></h1>
  </div>
  <div class="sous">Abonnés, statuts d'accès et journal des connexions (lieu, date, durée).</div>
  <div class="barre">
    <a href="index.html">🏠 Retour au site</a>
    <button id="btn-refresh" type="button">🔄 Actualiser</button>
    <button id="btn-logout" type="button">🚪 Déconnexion</button>
  </div>
  <div class="msg" id="msg"></div>

  <h2>👥 Abonnés</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>E-mail</th><th>Statut</th><th>Inscrit le</th><th>Actions</th></tr></thead>
      <tbody id="tb-abonnes"></tbody>
    </table>
  </div>

  <h2>🕒 Journal des accès</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Abonné</th><th>Début</th><th>Durée</th><th>Lieu</th><th>Page</th></tr></thead>
      <tbody id="tb-acces"></tbody>
    </table>
  </div>

<script src="assets/js/supabase-umd.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
