<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, noai, noimageai" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://*.supabase.co https://ipapi.co; base-uri 'self'" />
<link rel="icon" href="https://aymenessouyah.github.io/STiV2.0/assets/icons/STI_by_AE.ico" />
<title>Tableau de bord — STI V2.0</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0b0d16; color: #eef0f9; font-family: system-ui, "Segoe UI", sans-serif; padding: 24px; }
  h1 { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
  h1 span { font-size: 11px; background: linear-gradient(120deg,#ff8a50,#ffb27a); color: #14100e; border-radius: 999px; padding: 3px 8px; vertical-align: 4px; margin-left: 6px; }
  .sous { color: #9aa2ba; font-size: 13px; margin-bottom: 20px; }
  .barre { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .barre a, .barre button {
    border: 1px solid #323a58; background: #141827; color: #eef0f9; padding: 9px 16px;
    border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none;
  }
  .barre button:hover, .barre a:hover { border-color: #ff8a50; }
  h2 { font-size: 16px; margin: 26px 0 10px; color: #ff8a50; }
  .table-wrap { overflow-x: auto; border: 1px solid #242a41; border-radius: 14px; background: #141827; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  th { text-align: left; color: #9aa2ba; font-size: 11.5px; text-transform: uppercase; letter-spacing: 1px; padding: 12px 14px; border-bottom: 1px solid #242a41; }
  td { padding: 11px 14px; border-bottom: 1px solid #1c2236; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .st { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; }
  .st.actif { background: rgba(110,231,183,.15); color: #6ee7b7; }
  .st.en_attente { background: rgba(242,181,50,.15); color: #f2b532; }
  .st.suspendu { background: rgba(139,147,255,.15); color: #8b93ff; }
  .st.exclu { background: rgba(255,122,122,.15); color: #ff7a7a; }
  .act { border: 1px solid #323a58; background: #0e1220; color: #eef0f9; border-radius: 8px; padding: 5px 9px; margin-right: 5px; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .act:hover { border-color: #ff8a50; }
  .msg { margin: 10px 0; font-size: 13px; font-weight: 700; min-height: 18px; }
  .msg.ok { color: #6ee7b7; } .msg.err { color: #ff7a7a; }
</style>
</head>
<body>
  <h1>⚙️ Tableau de bord <span>ADMIN</span></h1>
  <div class="sous">Abonnés, statuts d'accès et journal des connexions (lieu, date, durée).</div>
  <div class="barre">
    <a href="index.html">🏠 Retour au site</a>
    <button id="btn-refresh" type="button">🔄 Actualiser</button>
    <button id="btn-logout" type="button">🚪 Déconnexion</button>
  </div>
  <div class="msg" id="msg"></div>

  <h2>👥 Abonnés</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>E-mail</th><th>Statut</th><th>Inscrit le</th><th>Actions</th></tr></thead>
      <tbody id="tb-abonnes"></tbody>
    </table>
  </div>

  <h2>🕒 Journal des accès</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Abonné</th><th>Début</th><th>Durée</th><th>Lieu</th><th>Page</th></tr></thead>
      <tbody id="tb-acces"></tbody>
    </table>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
