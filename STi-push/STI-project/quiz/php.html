<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../assets/images/lycee_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz PHP - Testez vos connaissances</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      /* Écran de transition avec logo PHP */
      .splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #4a6ea8 0%, #3b5998 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }

      .splash-screen .php-logo {
        text-align: center;
        animation: pulse 1s ease infinite;
      }

      .splash-screen .php-logo span {
        font-size: 6em;
        display: block;
        animation: bounce 0.8s ease;
      }

      .splash-screen .php-logo p {
        font-size: 1.5em;
        color: white;
        margin-top: 20px;
        font-weight: bold;
        letter-spacing: 2px;
      }

      @keyframes pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
      }

      .splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      /* Logo PHP flottant à gauche */
      .php-float-logo {
        position: fixed;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 100;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 50%;
        padding: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        cursor: pointer;
        text-align: center;
      }

      .php-float-logo:hover {
        transform: translateY(-50%) scale(1.1);
      }

      .php-float-logo span {
        font-size: 3em;
        display: block;
      }

      .php-float-logo p {
        font-size: 0.8em;
        font-weight: bold;
        color: #4a6ea8;
        margin-top: 5px;
      }

      .home-link img {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        object-fit: cover;
      }

      @media (max-width: 768px) {
        .php-float-logo {
          left: 5px;
          padding: 8px;
        }
        .php-float-logo span {
          font-size: 1.8em;
        }
        .php-float-logo p {
          font-size: 0.6em;
        }
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #4a6ea8 0%, #3b5998 100%);
        color: white;
        padding: 30px;
        text-align: center;
        position: relative;
      }

      .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1em;
        opacity: 0.9;
      }

      .home-link {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 8px;
        font-weight: bold;
        transition: all 0.3s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .home-link:hover {
        background: rgba(255, 255, 255, 0.3);
        transform: translateY(-2px);
      }

      .category-tabs {
        display: flex;
        flex-wrap: wrap;
        background: #f8f9fa;
        border-bottom: 2px solid #e0e0e0;
        padding: 0;
        margin: 0;
      }

      .category-tab {
        flex: 1;
        padding: 15px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
        color: #666;
        border-bottom: 3px solid transparent;
      }

      .category-tab:hover {
        background: #e9ecef;
      }

      .category-tab.active {
        color: #4a6ea8;
        border-bottom-color: #4a6ea8;
        background: white;
      }

      .quiz-info {
        display: flex;
        justify-content: space-between;
        padding: 20px 30px;
        background: #f8f9fa;
        border-bottom: 2px solid #e0e0e0;
      }

      .question-counter,
      .score,
      .category-name {
        font-size: 1.1em;
        font-weight: bold;
        color: #4a6ea8;
      }

      .quiz-content {
        padding: 30px;
      }

      .question-text {
        font-size: 1.4em;
        color: #333;
        margin-bottom: 25px;
        font-weight: 500;
      }

      .options-list {
        list-style: none;
      }

      .option-item {
        background: #f8f9fa;
        margin: 12px 0;
        padding: 15px 20px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid transparent;
      }

      .option-item:hover {
        background: #e9ecef;
        transform: translateX(5px);
      }

      .option-item.selected {
        background: #d4edda;
        border-color: #28a745;
        color: #155724;
      }

      .option-item.correct {
        background: #d4edda;
        border-color: #28a745;
        color: #155724;
      }

      .option-item.wrong {
        background: #f8d7da;
        border-color: #dc3545;
        color: #721c24;
      }

      .radio-custom {
        margin-right: 15px;
        font-weight: bold;
      }

      .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        gap: 15px;
      }

      button {
        padding: 12px 30px;
        font-size: 1em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-weight: bold;
      }

      .btn-prev,
      .btn-next {
        background: #4a6ea8;
        color: white;
      }

      .btn-prev:hover,
      .btn-next:hover {
        background: #3b5998;
        transform: translateY(-2px);
      }

      .btn-submit {
        background: #28a745;
        color: white;
        flex: 1;
      }

      .btn-submit:hover {
        background: #218838;
        transform: translateY(-2px);
      }

      .btn-reset {
        background: #dc3545;
        color: white;
      }

      .btn-reset:hover {
        background: #c82333;
      }

      .result-container {
        margin-top: 30px;
        padding: 20px;
        background: #e7f3ff;
        border-radius: 10px;
        display: none;
      }

      .result-container.show {
        display: block;
        animation: slideIn 0.5s ease;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .final-score {
        font-size: 1.8em;
        font-weight: bold;
        color: #4a6ea8;
        text-align: center;
        margin: 20px 0;
      }

      .feedback {
        margin-top: 20px;
        padding: 15px;
        border-radius: 8px;
        display: none;
      }

      .feedback.show {
        display: block;
      }

      .feedback.correct {
        background: #d4edda;
        color: #155724;
        border-left: 4px solid #28a745;
      }

      .feedback.wrong {
        background: #f8d7da;
        color: #721c24;
        border-left: 4px solid #dc3545;
      }

      .progress-bar {
        width: 100%;
        height: 3px;
        background: #e0e0e0;
        position: relative;
      }

      .progress-fill {
        height: 100%;
        background: #4a6ea8;
        transition: width 0.3s ease;
      }

      @media (max-width: 768px) {
        .question-text {
          font-size: 1.2em;
        }

        .option-item {
          padding: 12px 15px;
        }

        button {
          padding: 10px 20px;
        }

        .category-tab {
          font-size: 0.85em;
          padding: 10px 5px;
        }

        .home-link {
          position: static;
          display: inline-block;
          margin-bottom: 15px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Écran de transition avec logo PHP -->
    <div class="splash-screen" id="splashScreen">
      <div class="php-logo">
        <span>🐘</span>
        <p>PHP</p>
      </div>
    </div>
    <!-- Logo PHP flottant à gauche -->
    <div class="php-float-logo" onclick="window.location.href='../index.html'">
      <span>🐘</span>
      <p>PHP</p>
    </div>
    <div class="container">
      <div class="header">
        <a href="../index.html" class="home-link">
          <img
            src="../assets/images/lycee_logo.png"
            alt="Logo Lycée"
            onerror="this.src='https://via.placeholder.com/24?text=LR'"
          />
          Accueil
        </a>
        <h1>🐘 Quiz PHP</h1>
        <p>Testez vos connaissances sur le langage PHP</p>
      </div>

      <div class="category-tabs" id="categoryTabs">
        <div class="category-tab active" data-category="general">
          📚 Généralités
        </div>
        <div class="category-tab" data-category="strings">📝 Chaînes</div>
        <div class="category-tab" data-category="arrays">📊 Tableaux</div>
        <div class="category-tab" data-category="mysqli">🗄️ MySQLi</div>
        <div class="category-tab" data-category="dates">📅 Dates</div>
      </div>

      <div class="quiz-info">
        <div class="category-name" id="categoryName">Généralités</div>
        <div class="question-counter">
          Question <span id="currentQuestion">1</span>/<span id="totalQuestions"
            >0</span
          >
        </div>
        <div class="score">
          Score: <span id="score">0</span>/<span id="maxScore">0</span>
        </div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="quiz-content">
        <div class="question-text" id="questionText"></div>
        <ul class="options-list" id="optionsList"></ul>

        <div class="feedback" id="feedback"></div>

        <div class="nav-buttons">
          <button class="btn-prev" id="prevBtn" onclick="previousQuestion()">
            ◀ Précédent
          </button>
          <button class="btn-next" id="nextBtn" onclick="nextQuestion()">
            Suivant ▶
          </button>
          <button
            class="btn-submit"
            id="submitBtn"
            onclick="submitQuiz()"
            style="display: none"
          >
            📊 Voir le résultat
          </button>
          <button class="btn-reset" onclick="resetQuiz()">
            🔄 Recommencer
          </button>
        </div>
      </div>

      <div class="result-container" id="resultContainer">
        <div class="final-score" id="finalScore"></div>
        <div id="resultDetails"></div>
      </div>
    </div>

    <script>
      // Gestion de l'écran de transition
      const splashScreen = document.getElementById("splashScreen");

      // Attendre 2 secondes puis faire disparaître l'écran
      setTimeout(() => {
        splashScreen.classList.add("fade-out");
        // Supprimer l'élément après l'animation
        setTimeout(() => {
          splashScreen.style.display = "none";
        }, 800);
      }, 2000);
      const questions = {
        general: [
          {
            text: "Quelle fonction permet de définir une constante en PHP ?",
            options: ["const()", "define()", "constant()", "DEFINE()"],
            correct: 1,
          },
          {
            text: "Quelle fonction retourne le type d'une variable ?",
            options: ["typeof()", "gettype()", "type()", "var_type()"],
            correct: 1,
          },
          {
            text: "Comment concatène-t-on deux chaînes en PHP ?",
            options: ["+", "&", ".", "concat()"],
            correct: 2,
          },
          {
            text: "Quelle fonction permet de supprimer une variable ?",
            options: ["delete()", "remove()", "unset()", "destroy()"],
            correct: 2,
          },
          {
            text: "Que retourne la fonction isset($var) si $var est définie et non nulle ?",
            options: ["true", "false", "null", "1"],

          },
          {
            text: "Quel est le bon moyen de démarrer une session en PHP ?",
            options: [
              "session_start()",

              "start_session()",
              "begin_session()",
            ],
            correct: 0,
          },
          {
            text: "Que fait l'opérateur '==' en PHP ?",
            options: [
              "Comparaison stricte (valeur et type)",
              "Comparaison de valeur seulement",
              "Assignation",
              "Comparaison d'objets",
            ],
            correct: 1,
          },
          {
            text: "Que fait l'opérateur '===' en PHP ?",
            options: [
              "Comparaison stricte (valeur et type)",
              "Comparaison de valeur seulement",
              "Assignation",
              "Comparaison d'objets",
            ],
            correct: 0,
          },
          {
            text: "Comment inclure un fichier en PHP ?",
            options: ["#include", "import", "require_once", "using"],
            correct: 2,
          },
          {
            text: "Quelle superglobale contient les données d'un formulaire envoyé par méthode POST ?",
            options: ["$_GET", "$_POST", "$_REQUEST", "$_SERVER"],
            correct: 1,
          },
        ],
        strings: [
          {
            text: "Quelle fonction transforme un tableau en chaîne de caractères ?",
            options: ["explode()", "join()", "implode()", "array_to_string()"],

          {
            text: "Quelle fonction retourne la longueur d'une chaîne ?",
            options: ["length()", "strlen()", "size()", "count()"],
            correct: 1,
          },
          {
            text: "Que fait la fonction str_replace() ?",
            options: [
              "Remplace des caractères dans une chaîne",
              "Remplace des éléments dans un tableau",
              "Supprime des caractères",
              "Insère des caractères",
            ],
            correct: 0,
          },
          {
            text: "Quelle fonction convertit une chaîne en majuscules ?",
            options: [
              "strtoupper()",
              "strtolower()",
              "ucfirst()",
              "uppercase()",
            ],
            correct: 0,
          },
          {
            text: "Quelle fonction extrait une sous-chaîne ?",
            options: ["substring()", "substr()", "str_slice()", "str_part()"],
            correct: 1,
          },
          {
            text: "Que retourne trim('  hello  ') ?",
            options: ["'  hello  '", "'hello  '", "'  hello'", "'hello'"],
            correct: 3,
          },
          {
            text: "Comment obtenir le code ASCII du premier caractère d'une chaîne ?",
            options: ["ascii()", "chr()", "ord()", "asc()"],

          },
          {
            text: "Que fait strpos('Hello world', 'world') ?",

            correct: 0,

        ],
        arrays: [
          {
            text: "Comment créer un tableau associatif en PHP ?",

          {

            correct: 1,

          {

          {

              "mysqli_row_count()",

            correct: 1,

          {

          {

          {

            text: "Que signifie 'm' dans le format de date() ?",
            options: [
              "Mois avec zéro",
              "Mois sans zéro",
              "Minute",
              "Jour du mois",
            ],
            correct: 0,
          },
          {
            text: "Quel est l'ordre des paramètres de checkdate() ?",
            options: [
              "(jour, mois, année)",
              "(mois, jour, année)",
              "(année, mois, jour)",
              "(mois, année, jour)",
            ],
            correct: 1,
          },
          {
            text: "Que retourne getdate() ?",
            options: [
              "Un timestamp",
              "Une chaîne formatée",
              "Un tableau associatif",
              "Un objet DateTime",
            ],
            correct: 2,
          },
          {
            text: "Que fait date('d/m/Y', strtotime('last sunday')) ?",
            options: [
              "Date du dernier dimanche",
              "Date du prochain dimanche",
              "Date du jour",
              "Date du dimanche précédent le mois dernier",
            ],
            correct: 0,
          },
        ],
      };

      let currentCategory = "general";
      let currentIndexInCategory = 0;
      let userAnswers = {};
      let quizSubmitted = false;
      let score = 0;

      // Initialiser userAnswers pour chaque catégorie
      function initUserAnswers() {
        for (let cat in questions) {
          if (!userAnswers[cat]) {
            userAnswers[cat] = new Array(questions[cat].length).fill(null);
          }
        }
      }

      function getCurrentQuestions() {
        return questions[currentCategory];
      }

      function getCurrentQuestion() {
        return getCurrentQuestions()[currentIndexInCategory];
      }

      function getTotalInCategory() {
        return getCurrentQuestions().length;
      }

      function updateDisplay() {
        if (quizSubmitted) return;

        const question = getCurrentQuestion();
        if (!question) return;

        document.getElementById("questionText").textContent = `Q${
          currentIndexInCategory + 1
        }. ${question.text}`;
        document.getElementById("currentQuestion").textContent =
          currentIndexInCategory + 1;
        document.getElementById("totalQuestions").textContent =
          getTotalInCategory();
        document.getElementById("categoryName").textContent =
          getCategoryName(currentCategory);

        const optionsList = document.getElementById("optionsList");
        optionsList.innerHTML = "";

        question.options.forEach((option, index) => {
          const li = document.createElement("li");
          li.className = "option-item";
          if (userAnswers[currentCategory][currentIndexInCategory] === index) {
            li.classList.add("selected");
          }
          li.innerHTML = `<span class="radio-custom">${String.fromCharCode(
            65 + index
          )}.</span> ${option}`;
          li.onclick = () => selectOption(index);
          optionsList.appendChild(li);
        });

        updateScore();

        const feedback = document.getElementById("feedback");
        feedback.classList.remove("show", "correct", "wrong");

        // Update progress bar
        const progress =
          ((currentIndexInCategory + 1) / getTotalInCategory()) * 100;
        document.getElementById("progressFill").style.width = `${progress}%`;

        // Update button visibility
        document.getElementById("prevBtn").style.display =
          currentIndexInCategory === 0 ? "none" : "block";
        const isLastQuestion =
          currentIndexInCategory === getTotalInCategory() - 1;
        document.getElementById("nextBtn").style.display = isLastQuestion
          ? "none"
          : "block";
        document.getElementById("submitBtn").style.display = isLastQuestion
          ? "block"
          : "none";
      }

      function selectOption(optionIndex) {
        if (quizSubmitted) return;

        userAnswers[currentCategory][currentIndexInCategory] = optionIndex;
        updateDisplay();

        const question = getCurrentQuestion();
        const isCorrect = optionIndex === question.correct;

        const feedback = document.getElementById("feedback");
        if (isCorrect) {
          feedback.textContent =
            "✓ Bonne réponse ! " + (question.explanation || "");
          feedback.className = "feedback show correct";
        } else {
          feedback.textContent = `✗ Mauvaise réponse. La bonne réponse était : ${String.fromCharCode(
            65 + question.correct
          )}. ${question.options[question.correct]}`;
          feedback.className = "feedback show wrong";
        }
      }

      function nextQuestion() {
        if (currentIndexInCategory < getTotalInCategory() - 1) {
          currentIndexInCategory++;
          updateDisplay();
        }
      }

      function previousQuestion() {
        if (currentIndexInCategory > 0) {
          currentIndexInCategory--;
          updateDisplay();
        }
      }

      function updateScore() {
        let tempScore = 0;
        for (let cat in questions) {
          for (let i = 0; i < questions[cat].length; i++) {
            if (
              userAnswers[cat] &&
              userAnswers[cat][i] !== null &&
              userAnswers[cat][i] === questions[cat][i].correct
            ) {
              tempScore++;
            }
          }
        }
        score = tempScore;
        const totalQuestions = Object.values(questions).reduce(
          (sum, cat) => sum + cat.length,
          0
        );
        document.getElementById("score").textContent = score;
        document.getElementById("maxScore").textContent = totalQuestions;
      }

      function submitQuiz() {
        const totalQuestions = Object.values(questions).reduce(
          (sum, cat) => sum + cat.length,
          0
        );
        let unanswered = 0;
        for (let cat in questions) {
          for (let i = 0; i < questions[cat].length; i++) {
            if (userAnswers[cat][i] === null) unanswered++;
          }
        }

        if (unanswered > 0) {
          if (
            !confirm(
              `Vous avez ${unanswered} question(s) sans réponse. Voulez-vous quand même voir votre résultat ?`
            )
          ) {
            return;
          }
        }

        quizSubmitted = true;
        updateScore();

        const resultContainer = document.getElementById("resultContainer");
        resultContainer.classList.add("show");

        const total = Object.values(questions).reduce(
          (sum, cat) => sum + cat.length,
          0
        );
        const percentage = (score / total) * 100;
        let grade = "";
        let gradeColor = "";
        if (percentage >= 90) {
          grade = "Excellent ! 🎉";
          gradeColor = "#28a745";
        } else if (percentage >= 75) {
          grade = "Très bien ! 👍";
          gradeColor = "#17a2b8";
        } else if (percentage >= 60) {
          grade = "Bien ! 📚";
          gradeColor = "#ffc107";
        } else if (percentage >= 40) {
          grade = "Peut mieux faire 💪";
          gradeColor = "#fd7e14";
        } else {
          grade = "Besoin de révision 📖";
          gradeColor = "#dc3545";
        }

        const finalScoreDiv = document.getElementById("finalScore");
        finalScoreDiv.innerHTML = `Votre score : ${score}/${total} (${percentage.toFixed(
          1
        )}%)<br><span style="color: ${gradeColor}; font-size: 1.2rem;">${grade}</span>`;

        let detailsHTML =
          '<h3 style="margin-top: 20px;">Détail des réponses par catégorie :</h3>';

        for (let cat in questions) {
          let catScore = 0;
          let catTotal = questions[cat].length;
          for (let i = 0; i < catTotal; i++) {
            if (userAnswers[cat][i] === questions[cat][i].correct) catScore++;
          }
          detailsHTML += `<h4 style="margin-top: 20px; color: #4a6ea8;">${getCategoryName(
            cat
          )} (${catScore}/${catTotal})</h4>`;

          for (let i = 0; i < questions[cat].length; i++) {
            const isCorrect = userAnswers[cat][i] === questions[cat][i].correct;
            const userAnswerText =
              userAnswers[cat][i] !== null
                ? questions[cat][i].options[userAnswers[cat][i]]
                : "Non répondue";
            const correctAnswerText =
              questions[cat][i].options[questions[cat][i].correct];

            detailsHTML += `
                        <div style="margin: 10px 0; padding: 10px; background: ${
                          isCorrect ? "#d4edda" : "#f8d7da"
                        }; border-radius: 8px;">
                            <strong>Q${i + 1}.</strong> ${
              questions[cat][i].text
            }<br>
                            <span style="color: ${
                              isCorrect ? "#155724" : "#721c24"
                            }">
                                ${
                                  isCorrect ? "✓" : "✗"
                                } Votre réponse : ${userAnswerText}<br>
                                ${
                                  !isCorrect
                                    ? `Bonne réponse : ${correctAnswerText}`
                                    : ""
                                }
                            </span>
                        </div>
                    `;
          }
        }

        document.getElementById("resultDetails").innerHTML = detailsHTML;
        document.querySelector(".nav-buttons").style.display = "none";
        document.querySelector(".category-tabs").style.pointerEvents = "none";
      }

      function resetQuiz() {
        currentIndexInCategory = 0;
        userAnswers = {};
        quizSubmitted = false;
        score = 0;

        initUserAnswers();

        document.getElementById("resultContainer").classList.remove("show");
        document.querySelector(".nav-buttons").style.display = "flex";
        document.querySelector(".category-tabs").style.pointerEvents = "auto";
        document
          .getElementById("feedback")
          .classList.remove("show", "correct", "wrong");

        updateDisplay();
        updateScore();
      }

      function changeCategory(category) {
        if (quizSubmitted) return;
        currentCategory = category;
        currentIndexInCategory = 0;
        updateDisplay();

        // Update active tab
        document.querySelectorAll(".category-tab").forEach((tab) => {
          if (tab.dataset.category === category) {
            tab.classList.add("active");
          } else {
            tab.classList.remove("active");
          }
        });
      }

      function getCategoryName(cat) {
        const names = {
          general: "📚 Généralités",
          strings: "📝 Chaînes de caractères",
          arrays: "📊 Tableaux",
          mysqli: "🗄️ MySQLi",
          dates: "📅 Dates et heures",
        };
        return names[cat] || cat;
      }

      // Set up category tabs
      document.querySelectorAll(".category-tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          changeCategory(tab.dataset.category);
        });
      });

      // Initialize
      initUserAnswers();
      updateDisplay();
    </script>
  </body>
</html>
