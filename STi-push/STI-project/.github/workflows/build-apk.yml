name: Build APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le dossier www (sans doublons ni archives)
        run: |
          mkdir www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='www' \
            --exclude='Sti 2026-2027-Cours' \
            --exclude='*.zip' --exclude='*.rar' --exclude='*.bat' --exclude='*.lnk' \
            --exclude='README.md' \
            ./ www/

      - name: Créer le projet Android (Capacitor)
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "STI By A.E" tn.lycee.stibyae --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compiler l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: STI-By-AE-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
